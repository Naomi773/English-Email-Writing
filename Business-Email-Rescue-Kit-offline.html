<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Email Rescue Kit</title>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one narrow column, one screen = one job. Home picks a task, a stage lists its questions, a question page answers one question with collapsed groups. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f4; --ink:#1a2130; --muted:#647083; --line:#e1e5ec;
  --accent:#2747c8; --accent-soft:#e8ecfb; --bad:#b0281f; --bad-soft:#fcefed; --good:#17734a; --good-soft:#e8f4ee;
  --warn:#9a5600; --warn-soft:#fdf3e4; --mark:#fff0b8; --mark-ink:#5b4300;
  --f-ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Source Serif 4",Georgia,"Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#181d27; --sunk:#1f2531; --ink:#e7eaf0; --muted:#9ca5b5; --line:#2b3242;
  --accent:#97abff; --accent-soft:#212a46; --bad:#ff9087; --bad-soft:#3a2020; --good:#74d4a3; --good-soft:#173125;
  --warn:#f1b65e; --warn-soft:#352813; --mark:#4a3d12; --mark-ink:#ffe7a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#181d27; --sunk:#1f2531; --ink:#e7eaf0; --muted:#9ca5b5; --line:#2b3242;
  --accent:#97abff; --accent-soft:#212a46; --bad:#ff9087; --bad-soft:#3a2020; --good:#74d4a3; --good-soft:#173125;
  --warn:#f1b65e; --warn-soft:#352813; --mark:#4a3d12; --mark-ink:#ffe7a0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.65}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* slim top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px;white-space:nowrap}
.crumb{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px;white-space:nowrap}

/* headings */
.kicker{font-size:13px;color:var(--accent);font-weight:500;margin:32px 0 6px}
h1{font-size:clamp(24px,5vw,30px);line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
h1 .en{display:block;font-family:var(--f-text);font-weight:400;font-size:17px;color:var(--muted);margin-top:4px}
.lede{color:var(--muted);margin:10px 0 0;font-size:15.5px}
.when{margin:14px 0 0;font-size:15px;color:var(--muted)}
.when b{color:var(--ink);font-weight:500}
.label{font-size:13px;color:var(--muted);margin:36px 0 12px;font-weight:500}

/* home */
.search{position:relative;margin-top:22px}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 44px 14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:8px;font-size:18px}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--warn)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stage{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--accent)}
.stage .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px}
.stage b{display:block;font-size:17px}
.stage span{display:block;font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:2px}

/* question list */
.qlist{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.q{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px;cursor:pointer;width:100%}
.q:hover{border-color:var(--accent)}
.q .tx{flex:1;min-width:0}
.q b{display:block;font-size:17px;font-weight:500;line-height:1.45}
.q span{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.5}
.q .arr{color:var(--muted);font-size:20px}
.steps{display:flex;gap:6px;margin-top:18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* question page */
.top{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.formula{border-radius:14px;padding:14px 16px;background:var(--accent-soft);font-size:16px;font-weight:500;line-height:1.6}
.formula small{display:block;font-size:12.5px;color:var(--accent);font-weight:500;margin-bottom:2px}
.tip{font-size:14.5px;color:var(--muted);padding:2px 2px 2px 14px;border-left:3px solid var(--line);line-height:1.65}
.groups{display:flex;flex-direction:column;gap:12px;margin-top:28px}
details.grp{scroll-margin-top:72px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
details.grp>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .tx{flex:1;min-width:0}
details.grp>summary b{display:block;font-size:16.5px;font-weight:500}
details.grp>summary span{font-size:13px;color:var(--muted)}
details.grp>summary .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
details.grp>summary .chev{transition:transform .2s;color:var(--muted)}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp[open]>summary{border-bottom:1px solid var(--line)}
.items{display:flex;flex-direction:column;padding:6px 0}
.more{margin:8px 18px 12px;border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;cursor:pointer;color:var(--accent);font-size:14.5px}

/* items */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:start;padding:12px 18px}
.ph+.ph,.up+.up,.ph+.up,.up+.ph{border-top:1px solid var(--line)}
.ph .t,.up .t{font-family:var(--f-text);font-size:17.5px;line-height:1.5;overflow-wrap:anywhere}
.ph .z,.up .o{font-size:13.5px;color:var(--muted);line-height:1.5}
.ph .z em,.up .o em{font-style:normal;color:var(--accent)}
.act{grid-row:1 / span 2;grid-column:2;align-self:center}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 18px}
.var{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 4px;font-family:var(--f-ui);font-size:.85em}
.cp{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);white-space:nowrap;min-height:38px}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.cp.done{border-color:var(--good);color:var(--good)}
.blk{padding:10px 18px}

details.tpl{border-top:1px solid var(--line)}
.items>details.tpl:first-child{border-top:0}
details.tpl>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;gap:10px;align-items:baseline}
details.tpl>summary::-webkit-details-marker{display:none}
details.tpl>summary::before{content:"+";color:var(--accent);font-weight:700;width:12px;flex:0 0 12px}
details.tpl[open]>summary::before{content:"−"}
details.tpl>summary b{font-weight:500;font-size:16px}
details.tpl>summary span{font-size:13px;color:var(--muted)}
.tbody{padding:0 18px 16px 40px;display:flex;flex-direction:column;gap:12px}
.para .lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.para .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.para .t{font-family:var(--f-text);font-size:17px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-line}
.para.ex .t{color:var(--muted);font-size:16px}

.cmp{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.items .cmp{margin:8px 14px}
.cmp .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;align-items:start}
.cmp .k{grid-column:1 / -1;font-size:12.5px;font-weight:500;margin-bottom:-8px}
.cmp .bad{background:var(--bad-soft)} .cmp .bad .k{color:var(--bad)}
.cmp .bad .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.cmp .good{background:var(--good-soft)} .cmp .good .k{color:var(--good)}
.cmp .t{font-family:var(--f-text);font-size:16.5px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-line}
.cmp .why{padding:10px 16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}

.sub{padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.sub+.sub{border-top:1px solid var(--line)}
.sub .say{font-family:var(--f-text);font-size:17.5px;font-weight:600}
.sub .hid{font-size:15px;color:var(--bad)}
.sub .fix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;font-size:14.5px}
.sub small{display:block;font-size:12px;color:var(--muted)}
.rule{padding:12px 18px}
.rule+.rule{border-top:1px solid var(--line)}
.rule b{display:block;font-family:var(--f-text);font-size:16.5px;font-weight:600}
.rule span{font-size:14.5px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:500;white-space:nowrap}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;cursor:pointer;font-size:16px}
.chk+.chk{border-top:1px solid var(--line)}
.chk input{margin-top:5px;accent-color:var(--good);width:20px;height:20px;flex:0 0 auto}
.chk:has(input:checked) span{color:var(--muted);text-decoration:line-through}
details.mail{border-top:1px solid var(--line)}
.items>details.mail:first-child{border-top:0}
details.mail>summary{list-style:none;cursor:pointer;padding:14px 18px}
details.mail>summary::-webkit-details-marker{display:none}
details.mail>summary b{font-weight:500;font-size:16.5px}
details.mail>summary span{display:block;font-size:13.5px;color:var(--muted)}
.mailbody{display:flex;flex-direction:column;gap:12px;padding:0 14px 16px}
.mailbody .m{border-radius:12px;padding:14px 16px}
.mailbody .m.bad{background:var(--bad-soft)} .mailbody .m.good{background:var(--good-soft)}
.mailbody .k{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;margin-bottom:8px}
.mailbody .bad .k{color:var(--bad)} .mailbody .good .k{color:var(--good)}
.mailbody pre{margin:0;white-space:pre-wrap;font-family:var(--f-text);font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.mailbody .notes{font-size:14px;color:var(--muted);padding:0 4px}

/* bottom nav */
.next{display:flex;flex-direction:column;gap:10px;margin-top:40px}
.next .q{background:var(--accent-soft);border-color:transparent}
.next .q b{color:var(--accent)}

/* search results */
.res{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.rcard{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.rcard .rh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.rcard .rh b{font-size:16.5px;font-weight:500}
.rcard .rh span{display:block;font-size:13px;color:var(--muted)}
.rcard .go{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.empty{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:20px;color:var(--muted);margin-top:20px}
.empty b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px){
  .stages{grid-template-columns:minmax(0,1fr)}
  .tbody{padding-left:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* sidebar: docked column on wide screens, slide-over drawer on narrow ones */
.layout{display:block}
.side{display:none}
.side-in{padding:12px 12px 48px;display:flex;flex-direction:column;gap:2px}
.side-top{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 8px;font-size:13px;color:var(--muted)}
.side-x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:8px}
.side-x:hover{background:var(--sunk);color:var(--ink)}
.sl,.st,.sq{display:flex;width:100%;text-align:left;border:0;background:none;cursor:pointer;border-radius:10px;padding:8px 10px;align-items:center;gap:10px;font-size:15px;line-height:1.4}
.sl:hover,.st:hover,.sq:hover{background:var(--sunk)}
.side .on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sn{width:22px;height:22px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;flex:0 0 22px;color:var(--muted)}
.side .on .sn,.snode.ex .sn{background:var(--accent);color:var(--surface)}
.sc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.stree{display:flex;flex-direction:column;gap:2px;margin:6px 0;padding:8px 0;border-block:1px solid var(--line)}
.snode ol{list-style:none;margin:2px 0 8px 20px;padding:0 0 0 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.sq{font-size:14px;color:var(--muted);padding:6px 10px}
.comm{font-weight:500}
.comm .badge{margin-left:auto;font-size:11.5px;font-weight:500;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px;white-space:nowrap}
.scrim{display:none}
@media (min-width:1000px){
  body.side-open .layout{display:grid;grid-template-columns:288px minmax(0,1fr)}
  body.side-open .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);background:var(--surface)}
}
@media (max-width:999.98px){
  .side{display:block;position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(86vw,320px);background:var(--surface);border-right:1px solid var(--line);overflow:auto;transform:translateX(-102%);visibility:hidden;transition:transform .22s,visibility .22s;padding-top:env(safe-area-inset-top,0px)}
  body.side-open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:35}
  body.side-open .scrim{display:block}
}

/* community */
.next .q.plain{background:var(--surface);border-color:var(--line)}
.next .q.plain b{color:var(--ink)}
.q.commcard{background:var(--accent-soft);border-color:transparent}
.q.commcard b{color:var(--accent)}
.commtop{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--muted)}
#askbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px}
#askbox label,.ansform label{font-size:14.5px;font-weight:500;margin-top:10px}
#askbox label:first-child{margin-top:0}
#askbox label em{font-style:normal;font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
#askbox input:not([type=checkbox]),#askbox textarea,#askbox select,.ansform textarea,.ansform select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#askbox input:focus,#askbox textarea:focus,#askbox select:focus,.ansform textarea:focus,.ansform select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#askbox label.inline{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px}
#askbox label.inline input{width:18px;height:18px;accent-color:var(--accent)}
.from{font-size:13px;color:var(--accent);margin:0 0 4px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.formact{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:10px;padding:10px 20px;font-weight:500;cursor:pointer}
.primary:disabled{opacity:.6;cursor:default}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14.5px}
.ghost:hover{background:var(--sunk)}
.danger{color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg span{opacity:.7;margin-left:2px}
.qcards{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.qc{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px}
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:500;white-space:nowrap}
.s-open{background:var(--warn-soft);color:var(--warn)}
.s-ans{background:var(--good-soft);color:var(--good)}
.s-add{background:var(--accent-soft);color:var(--accent)}
.meta{font-size:13px;color:var(--muted)}
.qc h3{font-size:17px;margin:10px 0 0;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.qb{margin:6px 0 0;color:var(--muted);font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.ans{margin-top:12px;background:var(--good-soft);border-radius:12px;padding:12px 14px}
.ans .al{font-size:12.5px;color:var(--good);font-weight:500}
.ans p{margin:4px 0 0;font-family:var(--f-text);font-size:16.5px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.adm{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.adm summary{cursor:pointer;font-size:14px;color:var(--accent)}
.ansform{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.empty{margin-top:14px}
.en-note{display:flex;gap:8px;align-items:baseline;font-family:var(--f-text);font-style:italic;font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:4px;grid-column:1}
.en-note span{font-family:var(--f-ui);font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;padding:0 4px;flex:0 0 auto;transform:translateY(-1px)}
.top>.en-note{padding:0 2px 0 14px;margin-top:-4px}
body.hide-en .en-note{display:none}
.tone{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 10px;align-self:flex-start;grid-column:1;justify-self:start;margin-top:4px}

@tab prep | Before you write | | Before you start: settle the tone, then the greeting and your first line.

@sec tone | What tone should this email take? | Pick the right tone | When you're unsure whether to be formal or casual, or worried about being misread | tone formal informal casual
!tip It's easy to run out of words or worry about sounding rude, and in some situations (an urgent email, for example) the tone you choose can affect how fast business moves. This page helps you settle the tone first.
!tip Tone refers to the emotional context of your email, the level of formality and informality you adopt in communicating and your attitude towards your topic. Tone lets your readers know that you are communicating specifically with them and not with just anyone.
|Tone|Vibe|Best used for|Subtext trap
|Formal|Respectful, distant, structured|Legal docs, board updates, first-time outreach to C-suite|Can sound "robotic" or "cold" if overused
|Direct|Confident, concise, action-oriented|Deadlines, escalations, performance reviews|Can sound "aggressive" or "demanding" if missing a softener
|Empathetic|Warm, patient, supportive|Apologies, complaint handling, internal morale|Can sound "vague" or "weak" if you over-soften the action item
|Enthusiastic|Energetic, optimistic, collaborative|Product launches, team motivation, event invites|Can sound "fluffy" or "insincere" if not backed by facts
%Summary: when writing email, consider
r Focus on what you can do for your reader ;; Focus on what you can do for your reader
r Adopt a "reader-centred" approach ;; Put yourself in the reader's position
r Use positive language throughout ;; Use positive language from start to finish
r Adopt a more natural, conversational tone ;; Sound natural, as if you were talking
r Maintain the same tone throughout ;; Keep one tone through the whole email
%Informal tone (personal, simple, and direct)
x The sales report was finished by me yesterday. ;; I finished the sales report yesterday. ;; Prefer the active voice to the passive voice.
x The meeting, which will be held at 2 PM, is for the purpose of reviewing the budget, and you are requested to bring your notes with you. ;; The meeting is at 2 PM. We will review the budget. Please bring your notes. ;; Use shorter sentences.
x Feedback is required on this draft. A reply is needed before proceeding. ;; We need your feedback on this draft. I will wait for your reply before we proceed. ;; Use personal pronouns (I, we, they, etc.).
x This is to inform you that the deadline is Friday. Please communicate any difficulties. ;; Just a quick heads-up – the deadline is this Friday. Let me know if you run into any trouble! ;; Use elements of conversation.
%Formal tone (impersonal and objective)
x I processed the invoice this morning. ;; The invoice was processed this morning. ;; Use passive voice to achieve a more objective focus.
x We have reviewed and approved your contract. ;; The contract has been reviewed and approved. ;; Avoid using personal references (I, you, we, etc.) unless they are necessary.
x Our team will present the quarterly results at the conference. ;; The quarterly results will be presented at the conference. ;; Focus on what is done rather than who did it.
x Please send the money to the accounts folks later today. ;; Please forward the remittance to the accounting department by 5:00 PM. ;; Use precise words and expressions.
%5 subtext principles
r Certainty vs. Possibility: will vs. may ;; Subtext says "I am decisive." Use certainty for pricing/launches; use possibility for speculative features.
r Agency vs. Obligation: we invite vs. you must ;; Subtext says "You have a choice." Even when enforcing a requirement, frame it as a mutual next step.
r Clarity vs. Ambiguity: specific dates vs. soon ;; Subtext says "I respect your time." Vague subtext signals you are hiding something or are disorganized.
r Inclusion vs. Exclusivity: we vs. I / you ;; Subtext says "We are in this together." Use "we" for policies; use "I" for personal responsibility; use "you" sparingly in negative contexts.
r Validity vs. Defensiveness: Here is why vs. The reason is because ;; Subtext says "I am justifying fairly." Defensive subtext (forced us to, we had no choice) makes the reader distrust you. Frame changes as strategic choices, not reactive necessities.

@sec reader | How do I get people to cooperate? | Reader-centred & positive | When you need someone to act, need to point out a problem, or need to correct a team member | you attitude
!tip Talk about what the reader gains, not what you need. When you point out a problem, be firm but fair: the aim is to fix it, not to embarrass anyone.
%Create reader-based messages
r Emphasise "you" over "me" ;; Whenever possible, maintain a personal touch and emphasise "you" over "me" in your email.
r Focus on the reader's benefits and needs ;; We create the "you" attitude by highlighting the reader's benefits and concentrating on the reader's needs instead of your own.
r It's not just swapping "we" for "you" ;; However, we cannot create the "you" attitude by simply using "you" instead of "we" or "I" all the time.
x I want to emphasise the importance of following safety procedures. ;; Your safety is important to this company. Please follow all safety procedures carefully so as to avoid accidents. ;; When writing to staff, start from their own safety
x Since we have to update our training records, please fill in the attached form and return it to us by 31 May. ;; We would like to update our training records so that we can arrange appropriate training programmes for your career development. Would you please complete the attached form and return it to us by 31 May? ;; We believe that we can get the response we want more easily by adopting the "you" attitude.
%Emphasise the positive
r Keep the tone positive, avoid negativity ;; In general, you want to keep your tone positive and to avoid negativity. Even when writing to tell someone they've done something wrong, or to point out a problem, your tone should be firm but even-handed.
r The goal is a solution, not to put someone down ;; Remember your purpose is to change behaviour or to find a solution, not to cause offence or put another person down.
x You failed to send your expense claim form before the deadline, so you will not be compensated until the end of June. ;; As we did not receive your expense claim form before 30 April, we are afraid that we cannot compensate you until the end of June. ;; Your reader will feel much more comfortable dealing with the second, more positive approach, where the emphasis/blame has clearly been removed from the reader and directed towards the writer.
x It is quite obvious that somebody in your department cannot read. This is the second time this month I've had to return the overtime records because the client job numbers were not filled in. Give the job to someone else this time, okay? Or, at least tell them the facts – no overtime records, no overtime pay. ;; I am returning your overtime records because the client job numbers were not filled in. This oversight has occurred twice in one month. Please let your staff know that unless we have complete records, we cannot issue overtime cheques. I would appreciate your help in clearing up this problem. ;; Emotional blame only creates long-term problems
r In a bad mood? Write it, but don't send it ;; If you find yourself in a negative mood when you sit down to write, try to change your attitude. Or, write a negative email but don't send it. Making someone else feel bad may make you feel good, but think how it would feel to be on the receiving end of it. Short-term satisfaction is a poor exchange for creating long-term problems for yourself.
%Keep your tone natural
r Email is informal communication ;; With the exception of highly technical messages, emails are informal communications. Yet many writers feel that when they put their thoughts on paper, they must change their language into something more official sounding. However, it is more likely to ensure the reader's confusion.
x Herewith are the files for the Technoview audit. Please make an estimate of your requirements for the length of time you will need these files. Note this time on the enclosed slip and return the slip to me at your earliest convenience. ;; Here are the files for the Technoview audit. Please let me know how long you will need them. Write your time estimate on the attached slip and return the slip to me. ;; The writer obviously believes that a more official tone is likely to ensure that the reader will comply. The writer only needs to say it plainly.
r Say it out loud first; read it back when done ;; Over-official language prevents clear communication. Hear yourself telling the reader what you want him or her to know before you write it. Read your message aloud. Try and attain a clear, straightforward style that lets your true "voice" come through.

@sec greet | How do I address the reader? | Greetings & salutations | The first line, when you can't decide between Dear and Hi | Dear Hi Mr Ms
%Everyday
- Hi [First Name], ;; Best for most professional emails ;; Neutral
- Hello [First Name], ;; Slightly more formal than "Hi" ;; Neutral
- Dear [Title + Last Name], ;; Best for formal first contact ;; Formal
- Good morning [Title + Last Name], ;; Formal, time-specific ;; Formal
- Hey [First Name], ;; Only for people you know well ;; Warm
- Dear Jack, ;; When you know the person or if you are comfortable on a first-name basis ;; Warm
%Groups & unknown names
- Hi everyone, ;; For addressing a group ;; Neutral
- Dear [Full Name], ;; Best when unsure of gender/title ;; Formal
- Dear Ms. [Last Name], ;; If you do not know whether the person prefers Mrs. or Miss ;; Formal
- Greetings, ;; Use when you don't know the recipient's name ;; Formal
- Dear Hiring Manager, ;; When name is unknown, better than "To Whom It May Concern" ;; Formal
- Dear Accounting Staff, ;; When you do not know the exact person to contact ;; Formal
- Dear Client Services Representative, ;; Addressing a role ;; Formal
%With titles
- Dear Dr. [Last Name], ;; Doctors and PhDs ;; Formal
- Dear Senator Collins, ;; Government officials; Governor also works ;; Formal
- Dear Commissioner Samson, ;; Job titles; Chief / Colonel / Reverend also work ;; Formal
%Most common mistake
x Dear Mr. John, ;; Dear John, (informal) / Dear Mr. Smith, (formal) / Dear John Smith, (safe) ;; Wrong—"Mr." goes with the surname, not the first name. "Dear John Smith," is perfectly neutral and professional for first contact.
!tip Do not abbreviate titles in the greeting. Spell all names and titles correctly. A colon or a comma can be used after the name, but a comma is softer and friendlier.

@sec open | How do I write the first line? | Opening lines | Replying to an enquiry, reaching out, or picking up an earlier conversation | BLUF
!formula State your purpose in the first sentence (BLUF: Bottom Line Up Front). Put the background in the second.
!tip BLUF – Bottom Line Up Front.
x Regarding the project we discussed last week during the meeting with the client, we have been analyzing the new data and we found some discrepancies which might affect the overall timeline significantly, so I am writing to ask you... ;; I'm writing to request a 3-day extension on the project deadline. For context, we found data discrepancies during our analysis yesterday. ;; Before: the recipient reads 30 words and still doesn't know what you want. After: the recipient knows the exact ask in the first 7 words.
%Thanks for contacting us
- Thank you for contacting us about ... ;;  ;; Neutral
- We appreciate you reaching out to us regarding ... ;;  ;; Neutral
- Thank you for your recent inquiry concerning ... ;;  ;; Formal
%Thanks for your interest
- Thank you for expressing an interest in ... ;;  ;; Neutral
- Thank you for your keen interest in our ... ;;  ;; Neutral
- We are grateful for your expressed interest in ... ;;  ;; Formal
%We received your request
- We have received your request for a demonstration of ... ;;  ;; Neutral
- We acknowledge your request for a demonstration of ... ;;  ;; Formal
- Your interest in a product demonstration has been duly noted. ;;  ;; Formal
%Reaching out
- I'm writing to you in connection with ... ;;  ;; Neutral
- I am writing with reference to ... ;;  ;; Formal
- This correspondence serves as a follow-up to ... ;;  ;; Formal
%Replying to their email
- Following your email enquiry, ... ;;  ;; Neutral
- In response to your email inquiry, ... ;;  ;; Formal
- Pursuant to your recent email, ... ;; Very formal, close to legal style ;; Formal
%Moving things forward
- I would just like to follow up on your interest in ... ;;  ;; Neutral
- I am writing to further explore your interest in ... ;;  ;; Formal
- To progress your initial interest, I would like to ... ;;  ;; Formal
%After a phone call
- Further to our telephone conversation yesterday, ... ;;  ;; Neutral
- Building on our discussion yesterday, ... ;;  ;; Neutral
- To formalize the points raised during our teleconference yesterday, ... ;; Puts what was said on the phone in writing ;; Formal
%Referred by a colleague
- My colleague has informed me you're interested in ... ;;  ;; Neutral
- My colleague, [Name], has indicated your potential interest in ... ;;  ;; Formal
- It has been brought to my attention by my colleague that you are exploring ... ;;  ;; Formal

@sec intro-self | How do I introduce myself? | Introducing yourself | First contact with a stranger or new client, or introducing yourself to the company as a new hire | 
!tip Try to follow the introduction with a "That is why..." or "Specifically..." statement. The intro gets attention; the pivot gets the reply.
+ The "Mutual Connection" Intro ;; Introduced by a mutual contact ;; Warm ;; I hope this email finds you well. [Mutual Contact Name] suggested I reach out to you, given your expertise in [Industry/Field]. I'm [Your Name], a [Your Job Title] at [Your Company], and I'd love to get 5 minutes on your calendar to share how we've helped similar teams. ;;  ;; Tone: Warm
+ The "Shared Experience" Intro ;; Met at a trade show or event ;; Warm ;; It was a pleasure connecting with you at the [Event Name] last week. I'm [Your Name] from [Your Company]—we briefly discussed [specific topic] near the keynote stage. I'm following up because I believe there is a strong synergy between your work in [Their Area] and what we are building. ;;  ;; Tone: Networking / Events
+ The "Value-First" Cold Intro ;; Cold outreach that leads with value ;; Neutral ;; My name is [Your Name] and I lead [Department] at [Your Company]. I've been following [Their Company]'s recent growth in [Specific Area], and I noticed you might be facing [Specific Pain Point]. We helped a similar client reduce that friction by [X%], so I wanted to introduce myself. ;;  ;; Tone: Outreach
+ The "Post-Purchase / Account" Intro ;; Introducing yourself as the account contact after signing ;; Warm ;; Congratulations again on signing up with us! I'm [Your Name], your dedicated [Account Manager/Implementation Specialist] here at [Your Company]. My primary role is to ensure you see a return on investment immediately, so I've attached a quick 15-minute onboarding checklist to get us started. ;;  ;; Tone: Client Onboarding
+ The "Job Application / Proposal" Intro ;; Job application or proposal ;; Formal ;; My name is [Your Name] and I am a [Your Job Title] with over [X years] of experience in [Industry]. I am writing to formally introduce myself and submit my application for the [Role Name] position, as my background in [Specific Skill] aligns perfectly with your team's current objectives. ;;  ;; Tone: Formal
+ The "Re-Engagement" Intro ;; Reconnecting with an old contact ;; Warm ;; It has been far too long! This is [Your Name] from [Your Company]. We collaborated back in [Year/Project Name], and I recently came across your impressive work on [Recent Project]. I wanted to reintroduce myself and see if you are open to exploring a new initiative we are rolling out. ;;  ;; Tone: Old Contact
+ The "Media / PR" Intro ;; Reaching out to journalists or media ;; Neutral ;; Hi [First Name], I'm [Your Name], the [Your Job Title] at [Your Company]. I've been reading your articles on [Topic] and truly admire your perspective. I'm reaching out to introduce myself because I have a data-driven story regarding [Pitch Topic] that I think would resonate deeply with your audience. ;;  ;; Tone: Pitching
+ The "Vendor / Partner" Intro ;; Looking for a partner ;; Neutral ;; Allow me to introduce myself: I'm [Your Name], leading Business Development for [Your Company]. We specialize in [Your Service], but more importantly, we specialize in making our partners look good. I'm reaching out to see if a strategic partnership between our firms could unlock new value for your current client base. ;;  ;; Tone: Collaborative
+ The "Executive Summary" Intro ;; Writing to executives, straight to the point ;; Direct ;; I'm [Your Name], representing [Your Company]'s executive team. I won't waste your time with fluff—I'm reaching out directly because our data indicates a [X%] efficiency gap in [Their Industry] that we have cracked the code on. I'd like to introduce our solution to your operations lead. ;;  ;; Tone: C-Suite level
+ The "Internal / New Hire" Intro ;; A new hire introducing themselves to everyone ;; Warm ;; Hello Team, I'm [Your Name] and I am thrilled to join [Company Name] as the new [Job Title]. I come to you with a background in [Previous Experience], but my primary goal here is to listen and learn from each of you. I look forward to supporting [Department] and driving our Q4 initiatives together. ;;  ;; Tone: Company wide

@sec intro-other | How do I introduce two people? | Introducing someone else | Connecting colleagues, or recommending a candidate or consultant | networking
+ The "Busy Executive" Tone ;; The recipient is a very busy executive ;; Formal ;; I wanted to let you know that I passed your name on to [Colleague], a former colleague of mine who is researching [Topic]. I know your schedule is squeezed, so I don't make this request lightly—but I truly believe your years of experience would provide significant insight into the specific challenges they are facing. ;;  ;; Apologetic Tone · Best for: C-suite or overloaded contacts
+ The "Strong Endorsement" Tone ;; Strongly recommending a candidate or consultant ;; Direct ;; I'm introducing [Colleague], whose credentials are exceptionally strong—for seven years, they were [specific role]. I know your expertise will be incredibly valuable to their current initiatives, and I'm confident they would bring fresh value to your team as well. ;;  ;; Confident Tone · Best for: Recommending a candidate or consultant
+ The "Peer-to-Peer" Tone ;; Introducing two peers ;; Warm ;; I wanted to connect you with [Colleague], a former colleague of mine doing fascinating work in [Industry]. You both share a passion for [Common Interest], and I immediately thought of you. Perhaps you could explain to him how you approach [Specific Process]—I know he is keen to learn from your experience. ;;  ;; Collaborative Tone · Best for: Networking two equals
+ The "Low Pressure" Tone ;; Just a heads-up, no pressure ;; Warm ;; I just wanted to give you a quick heads-up that I passed your name on to [Colleague], who is networking in the [Industry] sector. They are tackling [Challenge], and I felt your strategic insight would be uniquely valuable. No pressure at all—just wanted to make the connection. ;;  ;; Soft Tone · Best for: FYI heads-ups with zero urgency
+ The "High-Stakes" Formal Tone ;; Senior advisors or strategic partnerships ;; Formal ;; I wanted to formally introduce you to [Colleague], a trusted former colleague and a recognized authority in [Field]. Your years of experience in [Recipient's Area] will provide significant insight into the project they are pioneering. I'm passing along a high-quality connection because I know you'll both find immense value. ;;  ;; Formal Tone · Best for: Senior advisors or strategic partnerships
+ The "Warm & Personal" Tone ;; With a personal touch ;; Warm ;; I'd love to connect you with [Colleague], a former colleague of mine who is doing some remarkable work on [Topic]. On a personal note, they are a gracious and personable individual—I genuinely think you will like them. I appreciate you even considering this. ;;  ;; Warm & Personal Tone · Best for: Softening a professional ask with personality
+ The "Specific Ask" Tone ;; You need them to act now ;; Direct ;; I'm reaching out to introduce [Colleague], who I believe would be a phenomenal fit for your needs regarding [Project]. They have incredibly strong credentials in this space, and I would appreciate it if you would take a few minutes to talk with them about your approach. ;;  ;; Direct Tone · Best for: When you need a clear, immediate action
+ The "Curiosity-Driven" Tone ;; Sparks interest without asking for a meeting ;; Neutral ;; I passed your name on to [Colleague], a former colleague of mine who is actively networking in [Industry]. They are particularly interested in how you've navigated [Specific Challenge], and I knew your reputation in that area would make you an excellent resource. Perhaps you could explain to them how you tackled it. ;;  ;; Curiosity-Driven Tone · Best for: Sparking interest without demanding a meeting
+ The "Grateful & Respectful" Tone ;; When you owe the recipient a favour ;; Formal ;; I'm introducing [Colleague], a former colleague whose work on [Topic] has been truly impressive. I know your schedule is squeezed, which is why I don't ask this lightly—but your guidance would mean a great deal to them. I deeply appreciate your help with this. ;;  ;; Grateful & Respectful Tone · Best for: When you owe the recipient a favor
+ The "Mutual Growth" Tone ;; Cross-industry, mutually beneficial ;; Neutral ;; I wanted to connect you with [Colleague], a former colleague of mine with seven years of experience in [Field]. I felt that your strategic insight on [Area] would be incredibly valuable to their current research, and conversely, their fresh perspective could offer new angles for your upcoming initiatives as well. ;;  ;; Mutual Growth Tone · Best for: Partnership or cross-industry collaboration

@tab ask | Ask | | Asking for help, requesting quotes, scheduling, inviting, chasing.

@sec request | How do I ask politely? | Polite requests | Asking for information, approval, an extension or a favour | kindly please
!formula Request = one courtesy word + the specific action + a clear deadline
x Please kindly send me the file ASAP. ;; Could you please send me the file by Friday? ;; "Please kindly" is overused and can sound dated; "ASAP" can sound demanding. English prefers a clear, polite request with a deadline.
%10 power words
- I am writing to seek your formal endorsement on the capital expenditure proposal. ;; Seek (the ultimate formal verb): It implies you are searching for their wisdom, rather than demanding an answer. It treats them as a knowledge authority. ;; Formal
- I would be most grateful (and deeply obliged) if you could furnish the detailed breakdown by Wednesday. ;; Grateful / Obliged (personal indebtedness): It explicitly states that their action will put you in their debt, shifting the weight onto you rather than onto them. ;; Formal
- Kindly share your preliminary observations before the executive review. ;; Kindly (the formal softener): It removes the sting of a direct imperative. Unlike "please," which can still sound like an order, "kindly" frames it as a courteous favor. ;; Formal
- Would it be possible (or feasible) for you to extend the submission window by 48 hours? ;; Possible / Feasible (the escape hatch): It places the burden of feasibility on logistics or circumstances, not on the recipient's willingness. It gives them a respectful out. ;; Neutral
- Please forward the signed MOU at your earliest convenience—only when your current priorities permit. ;; Convenience (ultimate time-respect): It explicitly signals that you value their existing schedule far more than your urgency. It removes all pressure. ;; Neutral
- Please advise on whether you prefer Option A or B, as your direction is critical here. ;; Advise (deferential guidance): Instead of asking for "data" or "answers," you are asking for their professional counsel. It elevates their response to high-level consulting. ;; Neutral
- Might I trouble you for a quick sanity-check on the attached pricing table? ;; Might / Could (modal hedging): Using the past-tense modals ("might" instead of "may," "could" instead of "can") creates psychological distance, making the request feel less immediate and pushy. ;; Formal
- If your schedule permits, allow me to request a 10-minute briefing on the merger status. ;; Permit / Allow (permission-based deference): It frames your request as an intrusion that you need their permission to even ask. Extremely high-formality, ideal for C-suite. ;; Formal
- I respectfully request your guidance (and operational assistance) in navigating the client's compliance audit. ;; Assistance / Guidance (action-oriented respect): It labels your request as needing help, not just menial action. This appeals to their expertise and ego in a respectful way. ;; Formal
- Could you kindly spare a few moments to confirm the quarterly headcount? ;; Spare (extreme time-deference): This is a highly formal, old-school business term that acknowledges that taking time to read your email is a sacrifice on their part. ;; Formal
!tip "At your earliest convenience" means "whenever suits you" and carries no urgency. When it really is urgent, give a specific time and say why (see "They haven't replied. How do I chase?").

@sec pricing | How do I ask a supplier for a quote? | Requesting a quote | Getting a quote from a new supplier, asking for a volume discount, keeping your rate at renewal, comparing prices | quotation quote price RFQ
!formula A good enquiry states: model/spec + quantity + destination/trade terms + lead time + payment terms + reply deadline
!tip Each template below is rated on Formality, Politeness and Straightforwardness. Choose based on your relationship with the supplier.
x We are interested in your product. Please send us your best price. ;; We are interested in Model X. Could you please quote your best FOB Shanghai price for 1,000 units, including lead time and payment terms? ;; Problem: No model, quantity, destination, terms, or deadline. The recipient cannot quote properly.
+ #1 Initial Inquiry ;; First contact with a new supplier ;; Formal ;; We are currently exploring potential partnerships for [product/service] and would respectfully request your most competitive formal quotation for [specifications], to be submitted by [deadline]. ;; We are currently exploring potential partnerships for industrial-grade packaging materials and would respectfully request your most competitive formal quotation for 500 units of custom boxes, to be submitted by May 10th. ;; Tone / Standards: Formality (High) | Politeness (High) | Straightforwardness (Medium) · Situation: First-time outreach to an unknown vendor
+ #2 Bulk / Volume Discount ;; Large order, asking for a volume discount ;; Neutral ;; Given our planned order volume of [quantity], we respectfully request a revised quotation reflecting your best tiered bulk-discount structure, effective from [threshold quantity]. ;; Given our planned order volume of 2,000 units, we respectfully request a revised quotation reflecting your best tiered bulk-discount structure, effective from 500 units. ;; Tone / Standards: Formality (Medium) | Politeness (High) | Straightforwardness (High) · Situation: Large order quantity requiring a discount
+ #3 Custom / Enterprise Solution ;; Custom package not on their website ;; Formal ;; Our specific operational needs require a tailored configuration including [features/modules]; therefore, we kindly request a custom enterprise pricing proposal that deviates from your standard public plans. ;; Our specific operational needs require a tailored configuration including unlimited API calls, white-label branding, and dedicated account management; therefore, we kindly request a custom enterprise pricing proposal that deviates from your standard public plans. ;; Tone / Standards: Formality (High) | Politeness (Medium) | Straightforwardness (High) · Situation: Requesting a tailored SaaS or service package not listed on the website
+ #4 Itemized Cost Breakdown ;; Itemised breakdown for internal approval ;; Formal ;; To facilitate our internal approval process, we kindly request a detailed, itemized breakdown of your quoted costs for [service/product], specifically delineating [components such as materials, labor, and overhead]. ;; To facilitate our internal approval process, we kindly request a detailed, itemized breakdown of your quoted costs for the website development project, specifically delineating design, front-end coding, back-end integration, and QA testing. ;; Tone / Standards: Formality (High) | Politeness (High) | Straightforwardness (High) · Situation: Need to see exactly what you are paying for to approve internally
+ #5 Renewal Pricing ;; Keeping the current rate at renewal (careful not to sound entitled) ;; Formal ;; As we approach our contract renewal on [date], we respectfully request your renewal proposal for the upcoming term, and we would greatly appreciate your consideration of maintaining our current favorable pricing, given our long-standing partnership. ;; As we approach our contract renewal on July 1st, we respectfully request your renewal proposal for the upcoming term, and we would greatly appreciate your consideration of maintaining our current favorable pricing, given our long-standing partnership of five years. ;; Tone / Standards: Formality (High) | Politeness (Very High) | Straightforwardness (Medium – careful not to sound entitled) · Situation: Loyal customer nearing contract expiry, asking to keep the old price
+ #6 Price Match / Competitor Comparison ;; Cheaper offer elsewhere, but you'd rather stay ;; Formal ;; While we have received a competitive offer from [competitor] at [price], we value our relationship with your firm and would like to ask whether you are able to match or improve upon this figure for [product], prior to our final decision. ;; While we have received a competitive offer from TechSolutions Inc. at $8,000/year, we value our relationship with your firm and would like to ask whether you are able to match or improve upon this figure for the enterprise CRM license, prior to our final decision. ;; Tone / Standards: Formality (High) | Politeness (Very High – diplomatic) | Straightforwardness (High) · Situation: You have a cheaper offer elsewhere but prefer the current vendor
+ #7 Post-Trial Purchase ;; Trial finished, ready to buy ;; Neutral ;; Having successfully completed our trial of [product], we are eager to move forward and kindly request your formal pricing proposal for [number of seats/units], including any applicable post-trial incentives you may offer. ;; Having successfully completed our trial of your project management software, we are eager to move forward and kindly request your formal pricing proposal for 25 user seats, including any applicable post-trial incentives you may offer. ;; Tone / Standards: Formality (Medium) | Politeness (High) | Straightforwardness (Medium) · Situation: You tested the product and now want to buy, asking for the next-step price
+ #8 One-Off / Project-Based Quote ;; One-off project with a clear scope ;; Neutral ;; We require a one-time execution of [project scope] within [timeframe] and would appreciate receiving your comprehensive lump-sum quotation, inclusive of all associated deliverables, by [date]. ;; We require a one-time execution of a 50-page corporate brochure with custom illustrations within three weeks and would appreciate receiving your comprehensive lump-sum quotation, inclusive of all associated deliverables, by Friday. ;; Tone / Standards: Formality (Medium) | Politeness (High) | Straightforwardness (Very High) · Situation: A single, non-recurring project with a clear scope
+ #9 Monthly Retainer ;; Ongoing monthly service ;; Neutral ;; We are seeking to engage your services on an ongoing monthly retainer basis for [service type], and we respectfully request your proposed monthly fee structure based on an estimated workload of [hours], along with any long-term commitment discounts. ;; We are seeking to engage your services on an ongoing monthly retainer basis for social media management and content creation, and we respectfully request your proposed monthly fee structure based on an estimated workload of 60 hours per month, along with any 6-month or 12-month commitment discounts. ;; Tone / Standards: Formality (Medium) | Politeness (High) | Straightforwardness (Medium) · Situation: Hiring an agency or freelancer for continuous monthly work

@sec follow | They haven't replied. How do I chase? | Following up & chasing | When someone is slow to reply, a task is stalled, or a deadline is close | follow up chase reminder revert circling back

x Why no reply? Waiting for your reply. ;; I wanted to follow up on my email below. Could you please let me know if you need any further information? I would appreciate a reply by [date]. ;; Problem: Sounds accusatory. English follow-ups usually assume goodwill and make it easy to reply.
x Please revert at the earliest. ;; Could you reply by end of day? That lets our developers deploy before the weekend maintenance window. ;; "Revert" means "go back to a previous state". Explain the why behind the timing.

? Just circling back to my previous email... ;; "I'm exhausted from waiting for your acknowledgment." ;; Forward the original thread with a fresh subject line and add one brand-new sentence of updated context.
? Just circling back... ;; "I'm tired of waiting for you." ;;

@tab reply | Reply | | After their email arrives: confirm, agree, decline, or own a mistake.

@sec reply-structure | How do I structure a reply to a request? | How to structure a reply | When a client or colleague has asked for something and you need to reply formally | reply structure
%Getting the tone right
r Reply quickly and build goodwill ;; Replies to email of request are a means of creating goodwill with clients as well as your colleagues. Such email should be responded to as quickly as possible.
r Use a personal tone: plenty of I, we, you ;; It is also important that the replies are written in the correct tone. The personal approach, with plenty of references to I, we, you, me, etc., is ideal for this kind of e-mail. Your reply should be polite and positive, and should give the impression that it is a pleasure for you to be able to respond to the reader and to carry out the request made.
r List every request first ;; Before you write a reply to a request, read through the text received and take note of all the requests (requests for information and requests for action) made by the client. If you have complied with the request already, tell the client so. If you have not been able to comply, tell the client what he or she can do. Be helpful.
!formula Paragraph 1: acknowledge and summarise what they asked for → Paragraph 2: agree (with details) or decline (with the reason and what they can do instead) → each further paragraph answers one request. Usually 3–4 paragraphs.
%Paragraph 1: acknowledge the request
!tip All replies to requests start with a paragraph acknowledging the request. Your acknowledgement should mention the date of the request, and should summarise what information has been asked for or what action has been requested.
- Thank you for your email of [date] regarding [subject]. ;;  ;; Neutral
- I have received your email of [date] requesting information about ... ;;  ;; Neutral
- I refer to your email of [date] enquiring about ... ;;  ;; Formal
- Further to your email of [date] asking for information on [topic], I would like to inform you that ... ;;  ;; Formal
- I refer to our telephone conversation of last Monday concerning ... ;; Responding to a request made by phone ;; Formal
%Paragraph 2: details of your response
!tip The second paragraph gives details of whether you can grant their request for information or action. If the request has been granted, the customer will need to know the full details of how the request has been carried out. If the request is denied, you need to tell the reader why it has been turned down and what the reader can do.
%Further paragraphs
!tip Remember that you should place only one point in each paragraph.
- We would also like to inform you that ... ;;  ;; Neutral
- Regarding your other request for ... ;;  ;; Neutral
- In answer to your question about ... ;; You can also say: In answer to your enquiry about ... ;; Neutral
- Concerning your other request for ... ;;  ;; Formal

@sec confirm | How do I confirm, or say I've received it? | Confirming & acknowledging | Confirming details, acknowledging a document or complaint, confirming attendance | confirm acknowledge receipt noted clarify
!tip In business, it is very important to clarify anything which you are not certain about. This helps you avoid making mistakes. Once you are sure you understand clearly, it's good business practice to confirm this, especially if you have asked for any clarification. In cases where clarification is not necessary, it is still good practice to confirm. This assures your reader everything is in hand. An email whose main purpose is to clarify or confirm information will generally be quite simple in structure.
%10 confirmation words
- I appreciate your swift confirmation on this matter. ;; Appreciate (softens the transaction): It frames the confirmation as a favor you're grateful for, not an obligation. ;; Neutral
- Your feedback has been duly noted and confirmed in the final draft. ;; Duly (formal & deferential): It implies you are treating their input with the serious, official weight it deserves. ;; Formal
- Please rest assured that I have confirmed all figures with the finance team. ;; Assure (builds trust): It shifts the focus from "I received this" to "I am giving you my personal guarantee." ;; Neutral
- I am deeply grateful for your written confirmation of the partnership terms. ;; Grateful (demonstrates indebtedness): It acknowledges that their confirmation cost them effort, which you value. ;; Formal
- I am pleased to confirm our acceptance of your revised proposal. ;; Pleased (expresses genuine satisfaction): It conveys that confirming this news brings you positive emotions, which humanizes the email. ;; Neutral
- I respectfully confirm the schedule changes you recommended. ;; Respectfully (establishes hierarchy & decorum): Ideal for senior stakeholders; it places their authority above your own during the confirmation. ;; Formal
- Your timely confirmation is highly valued by our entire implementation team. ;; Valued (validates the sender): It reassures the other party that their specific confirmation is not generic—it matters. ;; Neutral
- I am honored to confirm my participation in the board review. ;; Honor (elevates the confirmation): Best for confirming attendance or acceptances; it implies their invitation is prestigious. ;; Formal
- I can certainly confirm that the deliverables will arrive by Friday. ;; Certainly (shows enthusiastic willingness): It removes any hesitation or passive-aggression, replacing it with clear, warm agreement. ;; Neutral
- I acknowledge receipt of your confirmation and will proceed immediately. ;; Acknowledge (shows active listening): It proves you didn't just skim the email—you actively received and registered their message. ;; Formal
%Formally acknowledging receipt
!tip Use this to confirm you have received and understood a complaint, a document, or new instructions without promising immediate action.
!formula Say what you received + what happens next (or that it's on hold)
- This is to acknowledge receipt of [document/complaint]. ;;  ;; Formal
- We have reviewed and noted [the concerns raised in your correspondence dated July 28th]. ;;  ;; Formal
- These points have been documented for further internal evaluation. ;; Follows the sentence above with the next step ;; Formal
- Confirmation has been received regarding ... ;;  ;; Formal

u It is unlikely that I will be available. ;; At this stage, it appears unlikely that my schedule will permit participation, though I will notify you immediately should that change. ;; Soft Decline (Pre-emptive) ;; Tone: Cautious / Tentative
u Let us try again next time. ;; I sincerely hope we can reconnect at a future opportunity—please do keep me in mind for your next [Event/Initiative]. ;; Future Reconnection ;; Tone: Forward-Looking / Optimistic
u Please let me know if I can help in the future. ;; Should there be any way I can support your efforts in the future—whether remotely or in advance—please do not hesitate to reach out. ;; Offering Assistance ;; Tone: Accommodating / Supportive
u This is a difficult time. ;; Regrettably, this falls during a period of [High-Priority Project/Peak Season], which demands my full attention. ;; Soft Justification ;; Tone: Empathetic / Vague (use sparingly)
u Ms. Jones receives hundreds of requests to speak. ;; With the high volume of speaking requests [Name] receives, we are unable to accept every engagement—however, we truly appreciate this opportunity. ;; Clarifying Volume / Constraints (useful for assistants) ;; Tone: Objective / Capacity-Centric
u If you would like one of my colleagues to fill in ;; If it would be helpful, I would be happy to recommend a qualified colleague from my team—[Colleague Name]—who could [Speak/Represent] in my place. ;; Offering a Substitute/Alternative ;; Tone: Proactive / Solution-Oriented

@sec admit | We made a mistake. How do I admit it and apologise? | Admitting mistakes & apologising | When the error is on your side (a delay, wrong data), or you need to concede in a negotiation | sorry apologise apologize mistake
!formula State the facts objectively + take responsibility + explain the fix, then say how you'll prevent it
x Sorry sorry, it's our fault, but your order was also unclear. ;; We apologise for the delay. It was caused by [reason]. We have taken [action] and will ship by [date]. ;; Too much apology plus blame-shifting weakens credibility. A good apology acknowledges, explains, and commits to action.
%Admitting a mistake or oversight
!tip Use this when an error occurred on your side, such as a missed deadline, incorrect data, or a shipping delay. Formula: 1. State the fact objectively + 2. Take ownership + 3. State the corrective action. Do not use "I" or "you" unless absolutely necessary. Focus on the error and the fix.
- We acknowledge that ... ;;  ;; Formal
- It has come to our attention that ... ;;  ;; Formal
- Upon review, we have identified that ... ;;  ;; Formal
- We accept full responsibility for ... ;;  ;; Formal
- We regret to inform you that ... ;;  ;; Formal
+ Example: wrong invoice ;; Example: a wrong invoice ;; Formal ;; We acknowledge that [the error]. We accept full responsibility for this [oversight]. [Corrective action taken]. ;; We acknowledge that the invoice was processed with an incorrect billing code. We accept full responsibility for this administrative oversight. A corrected invoice has been issued and forwarded to your accounts department. ;; Phrases used: "We acknowledge that..." + "We accept full responsibility..."
%Conceding a point in a negotiation or dispute
!tip Use this when the other party makes a valid argument, and you formally agree to their terms or viewpoint without sounding weak. Formula: 1. Concede the point clearly + 2. Pivot to the next logical action. Use formal connectors like "however," "nevertheless," or "accordingly" to move the conversation forward.
- We concede that ... ;;  ;; Formal
- We do not dispute that ... ;;  ;; Formal
- We are in agreement with your assessment regarding ... ;;  ;; Formal
- We acknowledge the validity of ... ;;  ;; Formal
+ Example: accepting their timeline ;; Example: accepting their timeline ;; Formal ;; We concede that [their point]. Accordingly, [next action]. ;; We concede that your proposed delivery timeline is more efficient than our original estimate. Accordingly, we have updated our internal schedule to align with your requested date. ;; Phrases used: "We concede that..." + "Accordingly..."
%Critical rules for formal admission
x I am so sorry I messed this up! ;; An error was identified in the report. ;; Do: use passive voice to depersonalize the blame. Avoid: using emotional apologies.
x Things got crazy busy and I forgot. ;; The discrepancy resulted from a data-entry error. ;; Do: use precise, factual language. Avoid: using vague or casual excuses.
x Yes, we made a mistake. Hope that's okay. ;; ...however, preventative measures have been activated. ;; Do: pair the admission with a concrete solution. Avoid: admitting faults without a solution.
x I admit I failed... ;; We regret... ;; Do: use "We" or "The company" instead of "I" to sound institutional. Avoid: overusing "I" (unless you are a sole proprietor).
!tip Formal admission is a trust-building tool. When you objectively own an error in writing using these phrases, you actually increase the reader's confidence in your professionalism, rather than damaging it. Always end an admission email with a forward-looking statement to shift focus from the past mistake to the future fix.

@sec good | How do I share good news? | Sharing good news | Telling someone good news, or that you can meet their request | good news inform pleased

- You'll be glad to hear that ... ;; You can also say: happy to know / learn ;; Warm

@sec bad | How do I break bad news or a delay? | Bad news & delays | Late delivery, a request you can't meet, or a change of plan | delay late bad news
!formula Open with the current status → the reason → the new timing → an apology → a promise to keep them updated
x Maybe the delivery will be late. We will try our best. ;; I'm writing to update you on order #123. Due to [reason], the delivery date will be adjusted to [new date]. We apologise for the inconvenience and will keep you updated. ;; Problem: The reader cannot tell what is actually happening or what the new timeline is. English business email usually gives the status early and clearly.
- I'm sorry to let you know that ... ;;  ;; Neutral
- Unfortunately, we are unable to ... ;;  ;; Neutral
- Regrettably, ... ;; "Unfortunately, ..." also works ;; Formal
- We regret to inform you that ... ;;  ;; Formal

@sec more | How do I add more points and link them? | Adding information & transitions | When one email covers several things, or you need to connect ideas | transition furthermore in addition
%Adding information
- I would also like to inform you that ... ;;  ;; Neutral
- In addition, please note that ... ;;  ;; Neutral
- Furthermore, I would just like to let you know that ... ;;  ;; Neutral
- Moreover, we are able to ... ;;  ;; Formal
%Transitions
- However, / Consequently, / Nevertheless, / Conversely, / On the other hand, ;; Contrast ;; Neutral
- Furthermore, / Also, / Similarly, / In addition, / Equally significant, ;; Adding information ;; Neutral
- That is why / As a result / Therefore / For that reason / Given that ;; Purpose or result ;; Neutral
- Plus, you will receive ... ;;  ;; Warm
- That's not all. You will also ... ;;  ;; Warm
- Another issue is ... ;;  ;; Neutral
- Because of these circumstances, ... ;;  ;; Neutral
- In addition to those changes, we also ... ;;  ;; Neutral
- Such issues present us with a challenge. ;;  ;; Neutral
- That recommendation raises a few issues. ;; Refers back with a pronoun ;; Neutral
- This is important to us for several reasons. ;;  ;; Neutral
- Let me clarify. ;;  ;; Neutral
- One final consideration is ... ;;  ;; Neutral
!tip Transitions help to build coherence in writing by showing the reader the relationship between ideas. When transition words and phrases appear at the start of the sentence, they often (though not always) are followed by a comma. Be sure to choose the appropriate transition. If you are confused as to whether a word or phrase is a transitional expression, remember that transitional expressions can always be shifted to another place in the sentence without changing the meaning.

@sec price-up | How do I announce a price increase? | Announcing a price increase | When raw materials, exchange rates, freight, regulation or labour costs push prices up | price increase
!tip Give one main reason per price-increase email, and make three things clear: how much, from when, and what the customer can do (lock in the current rate, renew early).
+ #1 Raw Material Cost Spike ;; Raw material costs ;; Neutral ;; Due to a sharp increase in [raw material], which has risen by [percentage] over the last [timeframe], we are adjusting our pricing on [product line] effective [date]. ;; Due to a sharp increase in steel, which has risen by 18% over the last six months, we are adjusting our pricing on our entire hardware range effective May 1st. ;; Tone: Transparent & Explanatory
+ #2 New Feature / Product Upgrade ;; Product upgrade or new features ;; Warm ;; Because we have added [new features/improvements] that deliver [benefit], we are raising the price of [plan/product] from [old price] to [new price] starting [date]. ;; Because we have added AI-powered analytics and real-time reporting that deliver faster decision-making, we are raising the price of our Pro Plan from $49 to $59 starting June 1st. ;; Tone: Emphatic & Value-Driven
+ #3 General Inflation ;; Inflation or industry-wide increases ;; Formal ;; In response to ongoing inflationary pressures across our industry, we will implement a general price revision of [percentage] across [product/service category], effective [date]. ;; In response to ongoing inflationary pressures across our industry, we will implement a general price revision of 7% across all subscription tiers, effective July 15th. ;; Tone: Formal & Diplomatic
+ #4 Price Lock for Loyal Customers ;; Locking in the old rate for loyal customers ;; Warm ;; Although our standard pricing will increase to [new price] on [date], we are pleased to offer you—as a valued existing customer—the option to lock in your current rate of [old price] until [cut-off date]. ;; Although our standard pricing will increase to $99 on August 1st, we are pleased to offer you—as a valued existing customer—the option to lock in your current rate of $79 until July 31st. ;; Tone: Reassuring & Protective
+ #5 Advance Notice ;; Advance notice with a buffer period ;; Neutral ;; To give you ample time to prepare, we are announcing [number] days in advance that our prices will change from [old price] to [new price], effective [date]—allowing you to renew at the current rate before then. ;; To give you ample time to prepare, we are announcing 60 days in advance that our prices will change from $29 to $34, effective October 1st—allowing you to renew at the current rate before then. ;; Tone: Considerate & Urgent
+ #6 Phased Increase ;; Phased increase ;; Neutral ;; Instead of a single jump, we are implementing a phased increase: [percentage/amount] effective [first date], followed by [second percentage/amount] effective [second date], to ease the transition for you. ;; Instead of a single jump, we are implementing a phased increase: 4% effective March 1st, followed by another 4% effective September 1st, to ease the transition for you. ;; Tone: Strategic & Collaborative
+ #7 Currency Exchange Fluctuation ;; Exchange-rate changes (cross-border) ;; Neutral ;; Due to unfavorable movements in the [currency pair] exchange rate—which has shifted by [percentage] since [date]—we are revising our international pricing to [new price] starting [date]. ;; Due to unfavorable movements in the USD/EUR exchange rate—which has shifted by 12% since last quarter—we are revising our international pricing to €115 starting February 1st. ;; Tone: Factual & Neutral
+ #8 Shipping Cost Surge ;; Freight and shipping costs ;; Direct ;; Rising freight and shipping costs have forced us to raise the delivery-related component of our pricing; therefore, effective [date], the total price for [product] will increase by [amount/percentage]. ;; Rising freight and shipping costs have forced us to raise the delivery-related component of our pricing; therefore, effective April 15th, the total price for bulk orders will increase by 5%. ;; Tone: Apologetic & Direct
+ #9 Regulatory / Compliance Cost ;; Regulatory and compliance costs ;; Formal ;; New [regulation/compliance standard] requirements have added [cost] to our production process; to remain fully compliant, we must adjust our pricing to [new price], effective [date]. ;; New EU sustainability reporting requirements have added $50,000 to our production process; to remain fully compliant, we must adjust our pricing to €220, effective December 1st. ;; Tone: Formal & Authoritative
+ #10 Labor / Wage Cost ;; Labour costs ;; Warm ;; Our team is our greatest asset, and recent wage adjustments to retain top talent have increased our operating costs—so we will be raising our rates by [percentage] on [product/service] starting [date]. ;; Our team is our greatest asset, and recent wage adjustments to retain top talent have increased our operating costs—so we will be raising our rates by 8% on consulting services starting November 1st. ;; Tone: Personable & Honest

@sec move | How do I announce a move or new address? | Announcing a new location | When an office, store or warehouse relocates | relocation new address move
!tip Pick ONE reassurance statement per announcement (e.g., either "no disruption" OR "same quality service" OR "easy to find"). Overloading the reader with all three dilutes the impact. End with a clear call-to-action. If the move requires immediate action (e.g., shipping, visits), lead with the address (Templates 5 & 8). If the move is purely informative, place the address mid-way (Templates 2 & 9) so it feels like a natural update, not a demand.
+ #1 Formal Corporate ;; Formal announcement: board, investors, press release ;; Formal ;; We are pleased to announce that we have officially relocated. Effective [Date], our new address is [Full Address: Street, City, State, ZIP]. The new site will enable us to strengthen our ability to deliver on our strategic goals, and please be reassured that daily operations will not change. ;;  ;; Tone · Best for: Board members, investors, or official press releases
+ #2 Customer-Centric Reassurance ;; Reassuring loyal clients who value consistency ;; Warm ;; We are excited about the future at our new location, now located at [Full Address]. Please be reassured that this move will not affect daily operations—there will be no disruption in service whatsoever—and we will continue to serve you in the way you are accustomed to. ;;  ;; Tone · Best for: Loyal clients who value consistency
+ #3 Growth & Expansion ;; Showing growth ;; Neutral ;; We are pleased to announce our relocation to a larger space at [Full Address]. As we have outgrown our existing location, the new site will enable us to expand our capabilities. As a result of the move, we will be better positioned to serve you and will be expanding our offerings. ;;  ;; Tone · Best for: Showcasing success and future potential
+ #4 Apologetic & Transparent ;; When the move may cause short hiccups ;; Formal ;; We are pleased to announce our new location, effective [Date], at [Full Address]. We do apologize for any inconvenience this transition may cause and deeply appreciate your patience. Please be reassured that we are committed to ensuring no disruption in service throughout this period. ;;  ;; Tone · Best for: When there may be temporary hiccups during the move
+ #5 Operational & Practical ;; Focused on logistics ;; Neutral ;; We are pleased to announce that moving forward, we will be located at [Full Address]. You will find us easy to access, and this change will not affect our daily operations. Please update your records accordingly; we will continue to operate without interruption. ;;  ;; Tone · Best for: Emails that focus heavily on logistics
+ #6 Employee-Focused ;; For internal staff ;; Warm ;; We are excited about the future at our new location, officially moving to [Full Address] on [Date]. We are proud to share that we expect all our employees to remain with us throughout this transition. The new site will strengthen our ability to collaborate, and we appreciate your patience during this exciting chapter. ;;  ;; Tone · Best for: Internal announcements to staff or team morale
+ #7 Strategic Capability ;; Highlighting new capabilities or services ;; Neutral ;; We are pleased to announce our move to a new facility at [Full Address]. The new site will enable us to improve our ability to handle complex client needs. As a result of the move, we will be expanding our capacity while continuing to provide the same level of high-quality customer service you rely on. ;;  ;; Tone · Best for: Highlighting improved efficiency or new services
+ #8 Short & Direct ;; Short version: social media, newsletters ;; Direct ;; We are pleased to announce our new location: [Full Address]. We have outgrown our existing space and are excited for what's ahead. Please be reassured that there will be no disruption in service, and we look forward to welcoming you to our new home. ;;  ;; Tone · Best for: Social media blurbs, newsletters, or quick customer alerts
+ #9 VIP Client ;; For key accounts and long-standing partners ;; Warm ;; We are delighted to announce our move to [Full Address], a space designed specifically to serve you in the way you are accustomed to. We expect all our employees to remain with us, and your dedicated team will continue to provide uninterrupted, high-quality support. We appreciate your continued trust. ;;  ;; Tone · Best for: Top-tier accounts or long-standing partners
+ #10 All-Rounder ;; All-round version for mass emails ;; Neutral ;; We are pleased to announce that we have moved to a new location at [Full Address], effective [Date]. We have outgrown our existing space, and this new site will allow us to better serve you. Please be reassured that we will continue to operate without disruption and maintain the same level of high-quality customer service. We appreciate your patience during the transition. ;;  ;; Tone · Best for: General mass emails that balance growth and reassurance

- Please let me know if that works for you. ;;  ;; Neutral
- Feel free to reach out if you have any questions. ;;  ;; Warm
- If you have any questions, please reply to me directly. ;;  ;; Neutral

%Professional but warmer
