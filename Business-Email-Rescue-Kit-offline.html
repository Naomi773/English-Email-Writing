@sec checklist | 30-second pre-send check | Pre-send checklist | Before you hit Send | checklist proofread
c The subject line states the topic and the action, e.g. ACTION REQUIRED: Complete Annual Compliance Training by Next Friday
c The first sentence states the purpose (BLUF); background comes after
c Correct greeting: Mr. / Ms. + surname; names spelled correctly
c One point per paragraph
c Specific dates and times instead of soon, ASAP or at the earliest
c A clear next step: who, what, by when
c If something went wrong: facts, responsibility and a fix; no emotion, no blame-shifting
c No common slips: reply to, discuss (no about), contact (no with), look forward to + -ing
c Consistent tone throughout; no red-flag words like Just, Actually, Obviously
c The attachment is actually attached

@sec chinglish | Is this correct? Common non-native mistakes | Chinglish check | When you're unsure about grammar or worried about sounding unnatural | Chinglish grammar
%Verbs & prepositions
x I am appreciate for your great support on this project. ;; I really appreciate your great support on this project. ;; Appreciate is a verb (so no "am"), and it takes a direct object (so no "for" – you appreciate something, not appreciate for something).
x I appreciate if you can finish by the deadline. ;; I would appreciate it if you could finish by the deadline. ;; The fixed pattern is "appreciate it if"
x Please reply my email when you have time. ;; Please reply to my email when you have time. ;; In English, reply needs "to" (reply to someone).
x If any questions, please reply to me back directly. ;; If you have any questions, please reply to me directly. ;; "Reply" already means "answer back", so drop "back"; also use a full sentence
x I will discuss about this issue with the team. ;; I will discuss this issue with the team. ;; Discuss takes a direct object (no "about").
x I will contact with you next week. ;; I will contact you next week. ;; Contact takes a direct object (no "with").
x We apologize the inconvenience very much. ;; We deeply apologize for the inconvenience. ;; Apologize for something
x Regarding to your questions about the budget, I have prepared an update. ;; Regarding your questions about the budget, I have prepared an update. / With regard to your questions... ;; Regarding is a preposition itself – it never takes an extra "to". This is a very common slip that instantly flags non-native writing.
%Verb forms
x We are looking forward to receive your feedback soon. ;; We look forward to receiving your feedback soon. ;; In "look forward to", the "to" is a preposition, not part of an infinitive. Prepositions must be followed by a noun or a gerund (-ing).
x I suggest you to review the document carefully. ;; I suggest you review the document carefully. / I suggest reviewing the document carefully. ;; Suggest/recommend never take an infinitive with "to". They take a that-clause with a base verb (subjunctive) or a gerund (-ing).
x I suggest we should delay the launch. ;; I suggest we delay the launch. ;; Drop "should": a that-clause after suggest takes the base verb.
x I wish you can attend the meeting tomorrow. ;; I hope you can attend the meeting tomorrow. ;; Wish is for impossible, hypothetical, or unreal situations (e.g., "I wish I were a millionaire"). Hope is for realistic, future possibilities.
x You should be finish this before the system locks your access next Friday. ;; The training must be completed by next Friday, as the system will automatically lock your access after that date. ;; "Be" can't be followed by a base verb; state the deadline and the consequence
x Because our finance system occur some problems, so we need delay to 2 days. ;; Due to technical issues with our finance system, we must delay it by 2 days. ;; Don't use "because" and "so" together; "delay by" gives the length of the delay
%Word choice
x Dear All Staffs, ;; Dear All Staff, ;; "Staff" is a collective noun; no -s
x If you have doubt, please feel free to send email to us. ;; If you have questions, please email us. ;; "Doubt" means suspicion, not a question
x Please revert by 3 PM today. ;; Could you reply by 3 PM today? ;; "Revert" means go back to a previous state, not reply
x Please do the needful to complete all modules. ;; Please complete all modules by the deadline. ;; "Do the needful" is Indian English and unfamiliar to many UK/US readers
x Until now, only 45% of employees have completed the training. ;; To date, only 45% of employees have completed the training. ;; "To date" suits formal writing
x Please refer to the attached link to log in to the system. ;; Please click the link below to log in to the training system. ;; You click a link; you don't "refer to" it
%Too stiff
x Please be informed that the meeting has been moved to 3 PM. ;; Please note that the meeting has been moved to 3 PM. / Just a heads-up – the meeting is now at 3 PM. ;; "Please be informed" sounds like a court summons or a formal notice from a bank. In modern business English, it's stiff and unnatural. "Please note" is neutral and professional.
x In accordance with your request, I have attached the signed contract. ;; As you requested, I've attached the signed contract. / Per your request, I've attached the signed contract. ;; "In accordance with" is reserved for legal documents and official regulations. For everyday colleague/client emails, "as you requested" or "per your request" is crisp, modern, and clear.
x I am writing this email to inform you that I want to discuss about the new budget policy. ;; I'd like to schedule a time to discuss the new budget policy. ;; Skip the "I am writing this email to inform you" warm-up and get to the point
x Could you help to confirm the new time works for your team? ;; Could you confirm the new time works for your team? ;; "Help to" is unnecessary

@sec subtext | How will they read this? | Subtext decoder | When you can't read between the lines of their email, or worry yours will be misread | subtext hidden meaning
!tip In cross-cultural business, differences in culture and communication habits mean we often miss the subtext built into English phrases, in emails and in meetings. That leads to misunderstandings, and to hours spent guessing what the client really means and rewriting the same reply. Under time pressure it's even more stressful, and mistakes still happen. This page decodes the most common phrases so you can look them up on the spot, or browse them to build your cross-cultural instincts.
!tip Chasing phrases (Per my last email, Just circling back, touch base, Please revert at the earliest, etc.) are under Ask → They haven't replied. How do I chase?
%When they write this
? With all due respect... ;; "I strongly disagree and am about to criticize you." ;; 
? I might be wrong, but... / Just a thought... ;; "I am right, but I'm softening the blow so you don't get defensive." ;; 
? Thanks in advance ;; "I expect you to do this immediately, you don't have a choice." ;; 
? To be perfectly honest with you... ;; "I was exaggerating or omitting the truth in my previous sentences." ;; Delete the qualifier entirely. State the raw, plain fact without any preface.
? Let's take this offline. ;; "I'm uncomfortable documenting this conversation in a traceable channel." ;; Be transparent about the medium shift. Say: “This needs a collaborative whiteboard—grab my Calendly link for a quick 10-min screenshare.”
%When you write this
? Does that make sense? ;; "I think you're too slow to understand my brilliant idea." ;; Shift the clarity burden to yourself. Say: “Did I explain that clearly enough?”
? Just a quick question... ;; "My time is worth more than yours; I'll consume your minutes while pretending it's seconds." ;; Estimate the exact time commitment. Say: “This is a 2-minute ask regarding your onboarding flow.”
? I hope this email finds you well. ;; "This is a copy-pasted template; I have zero clue about your current situation." ;; Reference their recent digital footprint. Say: “Saw you visited our pricing page yesterday—perfect timing.”
? We think this would be a great fit for you. ;; "We blast this exact sentence to 10,000 people on our list." ;; Use behavioral specificity. Say: “Because you bookmarked our SEO guide, this tool plugs directly into that exact workflow.”
? I don't want to spam you, but... ;; "I fully know I'm spamming you, but I'm doing it anyway." ;; Remove the defensive apology. Lead immediately with the value proposition.
? If you're interested, reply to this email. ;; "All friction is on you; I am offering zero handholding or guidance." ;; Provide a one-click low-friction first step. Say: “Click 'Yes' inside this email, and I'll instantly unlock the bonus module.”
? We value you as a customer. ;; "This is a generic placeholder spat out by our CRM's drip campaign." ;; Demonstrate value instead of declaring it. Say: “Here's an exclusive template our VIP cohort requested—complimentary.”
? I'm not trying to sell you anything. ;; "I am absolutely selling, but I'm being dishonest about my intention." ;; Proudly own your commercial intent. Say: “This is a paid tier, but here's why 9 out of 10 users upgrade within the first week.”

? As per our records... ;; "This is a robotic, system-generated autopsy of your data; I don't know you." ;; Use conversational, human triggers. Say: “I noticed your free trial concluded yesterday...”

<script>
(function(){
const QUICK=[
  ['They haven’t replied','follow'],['We made a mistake','admit'],['I need to say no','decline'],
  ['A delay or bad news','bad'],['A price increase','price-up'],['Check before sending','checklist']
];
const TYPES={'-':'p','+':'tpl','x':'cmp','u':'up','?':'sub','r':'rule','c':'chk','m':'mail'};
const IMPLICIT={tpl:'Pick a template',p:'Phrases',cmp:'More before & after',up:'Line-by-line upgrades',sub:'Subtext',chk:'Checklist',mail:'Full email examples',rule:'Principles'};
const SHOW=6;

function sp(s,d){return s.split(d).map(x=>x.trim().replace(/\\n/g,'\n'))}
function parse(src){
  const tabs=[];let tab=null,sec=null;
  for(const raw of src.split('\n')){
    const line=raw.trim();
    if(!line||line.startsWith('//'))continue;
    if(line.startsWith('@tab ')){const f=sp(line.slice(5),'|');tab={id:f[0],zh:f[1],en:f[2],desc:f[3],secs:[]};tabs.push(tab);continue}
    if(line.startsWith('@sec ')){const f=sp(line.slice(5),'|');sec={id:f[0],zh:f[1],en:f[2],when:f[3]||'',kw:f[4]||'',blocks:[],tab};tab.secs.push(sec);continue}
    if(!sec)continue;
    if(line.startsWith('!tip ')){sec.blocks.push({t:'tip',f:[line.slice(5).trim()]});continue}
    if(line.startsWith('!formula ')){sec.blocks.push({t:'formula',f:[line.slice(9).trim()]});continue}
    if(line.startsWith('!en ')){sec.blocks.push({t:'en',f:[line.slice(4).trim()]});continue}
    if(line[0]==='%'){sec.blocks.push({t:'group',f:sp(line.slice(1),'|')});continue}
    if(line[0]==='|'){const cells=line.split('|').slice(1).map(c=>c.trim());const last=sec.blocks[sec.blocks.length-1];
      if(last&&last.t==='table')last.rows.push(cells);else sec.blocks.push({t:'table',rows:[cells],f:[]});continue}
    const ty=TYPES[line[0]];
    if(ty&&line[1]===' ')sec.blocks.push({t:ty,f:sp(line.slice(2),';;')});
  }
  return tabs;
}
/* Turn a section's flat blocks into: top (short context) + groups (each a collapsible set). */
function shape(s){
  const top=[],groups=[];let g=null;let firstCmp=false;
  for(const b of s.blocks){
    if(b.t==='group'){g={zh:b.f[0],en:b.f[1]||'',items:[]};groups.push(g);continue}
    if(g){g.items.push(b);continue}
    if(b.t==='formula'||b.t==='tip'||b.t==='table'||b.t==='en'){top.push(b);continue}
    if(b.t==='cmp'&&!firstCmp){firstCmp=true;top.push(b);continue}
    let ig=groups.find(x=>x.implicit===b.t);
    if(!ig){ig={zh:IMPLICIT[b.t]||'Content',en:'',items:[],implicit:b.t};groups.push(ig)}
    ig.items.push(b);
  }
  // implicit groups were created before explicit ones only if content preceded them; keep order of appearance
  return {top,groups};
}
const DATA=parse(document.getElementById('src').textContent);
const SECS={},TABS={};
DATA.forEach((t,i)=>{t.n=i+1;TABS[t.id]=t;t.secs.forEach(s=>{SECS[s.id]=s;s.shape=shape(s);
  s.blocks.forEach(b=>{b.sec=s;b.text=((b.f||[]).join(' ')+' '+(b.rows?b.rows.flat().join(' '):'')).toLowerCase()})})});
const COUNTABLE=new Set(['p','tpl','cmp','up','sub','mail']);
let total=0;DATA.forEach(t=>t.secs.forEach(s=>s.blocks.forEach(b=>{if(COUNTABLE.has(b.t))total++})));

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\[([^\]\n]+)\]/g,'<span class="var">[$1]</span>');
const enNote=t=>'<div class="en-note"><span>EN</span>'+fmt(t)+'</div>';
const enToggle=()=>'';const _enToggleOld=()=>{const on=!document.body.classList.contains('hide-en');return '<button class="entoggle" data-entoggle aria-pressed="'+on+'"><span class="sw"></span>English notes: '+(on?'on':'off')+'</button>'};
function setEn(on){document.body.classList.toggle('hide-en',!on);store.set('rk-en',on?'1':'0');document.querySelectorAll('[data-entoggle]').forEach(b=>{b.setAttribute('aria-pressed',on);b.innerHTML='<span class="sw"></span>English notes: '+(on?'on':'off')})}
const COPY=[];
const cbtn=t=>{COPY.push(t);return '<button class="cp" data-c="'+(COPY.length-1)+'">Copy</button>'};
const toneNote=(tone,zh)=>{const parts=[];if(tone)parts.push('<em>'+esc(tone)+'</em>');if(zh)parts.push(esc(zh));return parts.join(' · ')};

function item(b,first){
  const f=b.f;
  switch(b.t){
    case 'tip':return '<div class="blk"><div class="tip">'+fmt(f[0])+'</div></div>';
    case 'formula':return '<div class="blk"><div class="formula"><small>Formula</small>'+fmt(f[0])+'</div></div>';
    case 'en':return '<div class="blk">'+enNote(f[0])+'</div>';
    case 'p':{const z=toneNote(f[2],f[1]);return '<div class="ph"><div class="t">'+fmt(f[0])+'</div>'+(z?'<div class="z">'+z+'</div>':'')+(f[3]?enNote(f[3]):'')+'<div class="act">'+cbtn(f[0])+'</div></div>'}
    case 'tpl':return '<details class="tpl"><summary><div><b>'+esc(f[1])+'</b> <span>'+esc(f[0])+(f[2]?' · '+esc(f[2]):'')+'</span></div></summary><div class="tbody">'+
      '<div class="para"><div class="lbl">Template</div><div class="row"><div class="t">'+fmt(f[3])+'</div>'+cbtn(f[3])+'</div></div>'+
      (f[4]?'<div class="para ex"><div class="lbl">Example</div><div class="row"><div class="t">'+fmt(f[4])+'</div>'+cbtn(f[4])+'</div></div>':'')+(f[5]?'<div class="tone">'+esc(f[5])+'</div>':'')+'</div></details>';
    case 'cmp':return '<div class="cmp"><div class="r bad"><span class="k">✗ Avoid</span><div class="t">'+fmt(f[0])+'</div></div>'+
      '<div class="r good"><span class="k">✓ Write this</span><div class="t">'+fmt(f[1])+'</div>'+cbtn(f[1])+'</div>'+(f[2]||f[3]?'<div class="why">'+esc(f[2]||'')+(f[3]?enNote(f[3]):'')+'</div>':'')+'</div>';
    case 'up':return '<div class="up"><div class="o"><em>'+esc(f[2]||'')+'</em> · Original: '+esc(f[0])+'</div><div class="t">'+fmt(f[1])+'</div>'+(f[3]?'<div class="tone">'+esc(f[3])+'</div>':'')+'<div class="act">'+cbtn(f[1])+'</div></div>';
    case 'sub':{let fix='';if(f[2]){const q=f[2].match(/[“"]([^”"]+)[”"]/);fix='<div class="fix"><div><small>Better</small>'+fmt(f[2])+'</div>'+(q?cbtn(q[1]):'')+'</div>'}
      return '<div class="sub"><div class="say">'+fmt(f[0])+'</div><div class="hid">'+esc(f[1])+'</div>'+(f[3]?enNote('Hidden: '+f[3]):'')+fix+(f[4]?enNote('Action: '+f[4]):'')+'</div>'}
    case 'rule':return '<div class="rule"><b>'+fmt(f[0])+'</b><span>'+esc(f[1]||'')+'</span>'+(f[2]?enNote(f[2]):'')+'</div>';
    case 'chk':return '<label class="chk"><input type="checkbox"><span>'+fmt(f[0])+'</span></label>';
    case 'table':{const [h,...r]=b.rows;return '<div class="tbl"><table><thead><tr>'+h.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.map(row=>'<tr>'+row.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
    case 'mail':return '<details class="mail"'+(first?' open':'')+'><summary><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></summary><div class="mailbody">'+
      '<div class="m bad"><div class="k">✗ Before</div><pre>'+fmt(f[2])+'</pre></div>'+
      '<div class="m good"><div class="k">✓ After '+cbtn(f[3])+'</div><pre>'+fmt(f[3])+'</pre></div>'+(f[4]?'<div class="notes">'+esc(f[4])+'</div>':'')+'</div></details>';
  }
  return '';
}
function itemsHTML(list,limit){
  let firstMail=true,shown=0,out='',hidden='';
  for(const b of list){
    const counts=COUNTABLE.has(b.t)||b.t==='chk'||b.t==='rule';
    let h=item(b,b.t==='mail'&&firstMail);if(b.t==='mail')firstMail=false;
    if(limit&&counts&&shown>=limit){hidden+=h}else{out+=h;if(counts)shown++}
  }
  if(hidden){const n=(hidden.match(/class="(ph|up|cmp|sub|rule|chk)"|<details class="(tpl|mail)"/g)||[]).length;
    out+='<div class="hid-wrap" hidden>'+hidden+'</div><button class="more" data-more>Show '+n+' more</button>'}
  return out;
}
const countOf=g=>g.items.filter(b=>COUNTABLE.has(b.t)||b.t==='chk'||b.t==='rule').length;

const $=id=>document.getElementById(id);

let homeQuery='';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

        (ex?'<ol>'+t.secs.map(s=>'<li><button class="sq'+(s.id===curSec?' on':'')+'" data-nav="'+s.id+'">'+esc(s.zh)+'</button></li>').join('')+'</ol>':'')+'</div>'}).join('')+'</div>'+

function renderHome(focus){

  bar(null,'<b>Business Email Rescue Kit</b>');
  view.innerHTML='<p class="kicker">'+total+' ready-to-copy phrases</p><h1>What email do you need to write?</h1>'+
    '<div class="search"><input id="q" type="search" placeholder="Search: chase, apologise, decline, price increase, quote…" autocomplete="off" aria-label="Search"><button class="clr" id="clr" aria-label="Clear" hidden>✕</button></div>'+

  if(q){hb.innerHTML=searchHTML(q)+askCTA('Didn’t find what you need?',null);return}
  hb.innerHTML='<p class="label">Most urgent? Start here</p><div class="quick">'+QUICK.map(([l,id])=>'<button class="chip" data-nav="'+id+'">'+esc(l)+'</button>').join('')+'</div>'+
    '<p class="label">Or follow the steps of writing an email</p><div class="stages">'+DATA.map(t=>'<button class="stage" data-nav="'+t.id+'"><span class="n">'+t.n+'</span><div><b>'+esc(t.zh)+'</b><span>'+esc(t.desc)+'</span></div></button>').join('')+'</div>'+

function searchHTML(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit=x=>terms.every(t=>x.includes(t));
  const res=[];
  DATA.forEach(t=>t.secs.forEach(s=>{
    const secHit=hit((s.zh+' '+s.en+' '+s.when+' '+s.kw).toLowerCase());
    const items=s.blocks.filter(b=>COUNTABLE.has(b.t)&&hit(b.text));
    if(secHit||items.length)res.push({s,t,secHit,items});
  }));
  if(!res.length)return '<div class="empty"><b>No results for “'+esc(q)+'”.</b><br>Try another word, such as decline, delay, quote, chase or apologise.</div>';
  res.sort((a,b)=>b.secHit-a.secHit||b.items.length-a.items.length);
  return '<p class="label">'+res.length+' matching question'+(res.length>1?'s':'')+'</p><div class="res">'+res.slice(0,8).map(r=>{
    const preview=r.items.slice(0,2);
    return '<div class="rcard"><div class="rh"><div><b>'+esc(r.s.zh)+'</b><span>Step '+r.t.n+' · '+esc(r.t.zh)+(r.items.length?' · '+r.items.length+' match'+(r.items.length>1?'es':''):'')+'</span></div><button class="go" data-nav="'+r.s.id+'">Open ›</button></div>'+
      (preview.length?'<div class="items">'+itemsHTML(preview)+'</div>':'')+'</div>'}).join('')+'</div>';
}
function renderStage(t){
  COPY.length=0;
  bar(['home','Home'],'Step '+t.n+' · <b>'+esc(t.zh)+'</b>');
  view.innerHTML='<div class="steps">'+DATA.map(x=>'<i class="'+(x.n<=t.n?'on':'')+'"></i>').join('')+'</div>'+
    '<p class="kicker">Step '+t.n+' of '+DATA.length+'</p><h1>'+esc(t.zh)+'</h1><p class="lede">'+esc(t.desc)+' Pick the question you are facing now:</p>'+
    '<div class="qlist">'+t.secs.map(s=>'<button class="q" data-nav="'+s.id+'"><div class="tx"><b>'+esc(s.zh)+'</b><span>'+esc(s.when)+'</span></div><span class="arr">›</span></button>').join('')+'</div>'+
    (DATA[t.n]?'<div class="next"><button class="q" data-nav="'+DATA[t.n].id+'"><div class="tx"><span>Next step</span><b>'+DATA[t.n].n+' '+esc(DATA[t.n].zh)+'</b></div><span class="arr">›</span></button></div>':'');
}
function renderSec(s){
  COPY.length=0;
  const t=s.tab,idx=t.secs.indexOf(s),nx=t.secs[idx+1];
  bar([t.id,t.zh],'Step '+t.n+' '+esc(t.zh)+' · <b>'+(idx+1)+' / '+t.secs.length+'</b>');
  const {top,groups}=s.shape;
  view.innerHTML='<p class="kicker">'+esc(t.zh)+' · Question '+(idx+1)+' of '+t.secs.length+'</p><h1>'+esc(s.zh)+'<span class="en">'+esc(s.en)+'</span></h1>'+
    (s.when?'<p class="when"><b>When to use: </b>'+esc(s.when)+'</p>':'')+enToggle()+
    (top.length?'<div class="top">'+top.map(b=>b.t==='formula'?'<div class="formula"><small>Formula</small>'+fmt(b.f[0])+'</div>':b.t==='tip'?'<div class="tip">'+fmt(b.f[0])+'</div>':b.t==='en'?enNote(b.f[0]):item(b)).join('')+'</div>':'')+
    (groups.length?'<p class="label">'+(groups.length>1?'Pick a category to see the phrases (one opens at a time)':'Open to see the phrases')+'</p><div class="groups">'+groups.map((g,i)=>{const n=countOf(g);
      return '<details class="grp" name="grp"'+(i===0?' open':'')+'><summary><div class="tx"><b>'+esc(g.zh)+'</b>'+(g.en?'<span>'+esc(g.en)+'</span>':'')+'</div>'+(n?'<span class="cnt">'+n+'</span>':'')+'<span class="chev">›</span></summary><div class="items">'+itemsHTML(g.items,SHOW)+'</div></details>'}).join('')+'</div>':'')+
    '<div class="next">'+(nx?'<button class="q" data-nav="'+nx.id+'"><div class="tx"><span>Next question in this step</span><b>'+esc(nx.zh)+'</b></div><span class="arr">›</span></button>':'')+
    '<button class="q plain" data-nav="'+t.id+'"><div class="tx"><span>Back to</span><b>Step '+t.n+' '+esc(t.zh)+': all questions</b></div><span class="arr">›</span></button></div>'+
    askCTA('Not what you needed?',s.id);
}

/* ---------- community (shared db) ---------- */
const COMM={db:null,user:null,me:null,admin:false,write:null,state:'loading',qs:[],ans:{},open:0,filter:'all',ctx:null,draft:null,busy:false,readonly:false,names:{}};
const STATUS={open:['Open','s-open'],answered:['Answered','s-ans'],added:['Added to the kit','s-add']};
const statusOf=id=>(COMM.ans[id]&&STATUS[COMM.ans[id].status]?COMM.ans[id].status:'open');
const dateZh=iso=>{try{return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}};
function recount(){COMM.open=COMM.qs.filter(q=>statusOf(q.id)==='open').length}

async function initComm(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){COMM.state='off';refreshComm();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db){COMM.state='off';refreshComm();return}
    COMM.db=db;COMM.user=user;
    if(user){const [id,adm,w]=await Promise.all([user.id(),user.canEdit(),user.can('data.write')]);COMM.me=id;COMM.admin=!!adm;COMM.write=w}
    db.collection('questions').orderBy('createdAt','desc').limit(500).onSnapshot(snap=>{
      COMM.qs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));COMM.state='ready';recount();refreshComm();
    },err=>{COMM.state='error';refreshComm()});
    db.collection('answers').limit(1000).onSnapshot(snap=>{
      const a={};snap.docs.forEach(d=>{a[d.id]=d.data()});COMM.ans=a;recount();refreshComm();
    },()=>{});
  }catch(e){COMM.state='off';refreshComm()}
}
function refreshComm(){
  const h=(location.hash||'').slice(1);
  if(h==='community'){const y=window.scrollY;const keep=captureForm();renderComm();restoreForm(keep);window.scrollTo(0,y)}
  else if(!h){const hb=$('homebody');if(hb&&!homeQuery.trim())homeBody()}
  renderSide(curRoute.tab,curRoute.sec,h==='community');
}
function captureForm(){const f=$('askform');if(!f)return null;return{stage:$('a-stage').value,title:$('a-title').value,body:$('a-body').value,anon:$('a-anon').checked,open:!$('askbox').hidden,
  ans:[...document.querySelectorAll('.ansform')].map(x=>({id:x.dataset.q,text:x.querySelector('textarea').value,st:x.querySelector('select').value,open:x.closest('details').open}))}}
function restoreForm(k){if(!k||!$('askform'))return;$('a-stage').value=k.stage;$('a-title').value=k.title;$('a-body').value=k.body;$('a-anon').checked=k.anon;$('askbox').hidden=!k.open;$('askopen').hidden=k.open;
  k.ans.forEach(a=>{const x=document.querySelector('.ansform[data-q="'+a.id+'"]');if(x){x.querySelector('textarea').value=a.text;x.querySelector('select').value=a.st;x.closest('details').open=a.open}})}

function renderComm(){
  COPY.length=0;
  bar(['home','Home'],'<b>Ask the Team</b> · questions & answers');
  const canPost=COMM.state==='ready'&&COMM.me!==null&&COMM.write!==false&&!COMM.readonly;
  let note='';
  if(COMM.state==='loading')note='<div class="notice">Connecting…</div>';
  else if(COMM.state==='off')note='<div class="notice">This is the offline edition. Ask the Team needs an internet connection: open the online kit to ask a question. Everything else works offline.</div>';
  else if(COMM.state==='error')note='<div class="notice">Ask the Team is unavailable right now. Refresh the page later to try again.</div>';
  else if(!canPost)note='<div class="notice">You can browse questions and answers. To ask a question, the kit’s owner needs to give you Contributor access.</div>';
  const ctx=COMM.ctx&&SECS[COMM.ctx];
  const form=canPost?('<button class="q commcard" id="askopen" data-askopen'+(ctx?' hidden':'')+'><div class="tx"><b>Ask a question</b><span>One question at a time; the more specific, the better the answer</span></div><span class="arr">＋</span></button>'+
    '<form id="askform" class="askform" novalidate><div id="askbox"'+(ctx?'':' hidden')+'>'+
    (ctx?'<p class="from">From the page “'+esc(ctx.zh)+'”</p>':'')+
    '<label for="a-title">What situation are you in?<em>Required</em></label><input id="a-title" maxlength="120" placeholder="e.g. A client wants a 20% discount. How do I politely offer only 10%?" required>'+
    '<label for="a-body">More detail <em>Optional</em></label><textarea id="a-body" maxlength="1000" rows="4" placeholder="What you want to say, your draft, or the line in their email you are unsure about"></textarea>'+
    '<label for="a-stage">Which step of the email is this?</label><select id="a-stage"><option value="">Not sure</option>'+DATA.map(t=>'<option value="'+t.id+'"'+(ctx&&ctx.tab.id===t.id?' selected':'')+'>'+t.n+' '+esc(t.zh)+'</option>').join('')+'</select>'+
    '<label class="inline"><input type="checkbox" id="a-anon"> Ask anonymously (hide my name)</label>'+
    '<p class="err" id="a-err" hidden></p><div class="formact"><button type="submit" class="primary" id="a-submit">Submit question</button><button type="button" class="ghost" data-askcancel>Close</button></div></div></form>'):'';
  const qs=COMM.qs,n={all:qs.length,open:0,answered:0};
  qs.forEach(q=>{const s=statusOf(q.id);if(s==='open')n.open++;else n.answered++});
  const list=qs.filter(q=>COMM.filter==='all'||(COMM.filter==='open'?statusOf(q.id)==='open':statusOf(q.id)!=='open'));
  const seg=COMM.state==='ready'?'<div class="seg" role="tablist">'+[['all','All'],['open','Open'],['answered','Answered']].map(([k,l])=>'<button role="tab" aria-selected="'+(COMM.filter===k)+'" data-filter="'+k+'">'+l+' <span>'+n[k]+'</span></button>').join('')+'</div>':'';
  const cards=COMM.state!=='ready'?'':(!qs.length?'<div class="empty"><b>No questions yet.</b><br>Your problem is probably someone else’s too. Be the first to ask.</div>':
    (!list.length?'<div class="empty">No questions in this category yet.</div>':'<div class="qcards">'+list.map(qCard).join('')+'</div>'));
  view.innerHTML='<p class="kicker">Ask the Team</p><h1>Can’t find the right words? Ask here</h1>'+
    '<p class="lede">Describe the business situation or email problem you’re stuck on. We answer regularly, and questions we take up become new content in the kit.</p>'+
    '<div class="commtop">'+note+form+'</div>'+(COMM.state==='ready'?'<p class="label">Questions from everyone</p>'+seg:'')+cards;
  fillNames();
}
function qCard(q){
  const st=statusOf(q.id),a=COMM.ans[q.id],t=TABS[q.stage],from=SECS[q.from];
  const mine=COMM.me&&q.author===COMM.me;
  const meta=[t?('Step '+t.n+' '+esc(t.zh)):'',from?('from “'+esc(from.zh)+'”'):'',dateZh(q.createdAt)].filter(Boolean).join(' · ');
  const who=q.author?'<span class="who" data-uid="'+esc(q.author)+'">'+(mine?'Me':'…')+'</span>':'<span class="who">Anonymous</span>';
  let html='<article class="qc"><div class="qh"><span class="pill '+STATUS[st][1]+'">'+STATUS[st][0]+'</span><span class="meta">'+who+' · '+meta+'</span></div>'+
    '<h3>'+esc(q.title||'')+'</h3>'+(q.body?'<p class="qb">'+esc(q.body)+'</p>':'');
  if(a&&a.text)html+='<div class="ans"><div class="al">Answer'+(a.at?' · '+dateZh(a.at):'')+'</div><p>'+fmt(a.text)+'</p></div>';
  if(COMM.admin){
    html+='<details class="adm"><summary>'+(a&&a.text?'Edit answer':'Answer this question')+' (visible to admins only)</summary><div class="ansform" data-q="'+esc(q.id)+'">'+
      '<label for="ans-'+esc(q.id)+'">Answer</label><textarea id="ans-'+esc(q.id)+'" rows="5" maxlength="3000" placeholder="Write the recommended phrases; text in [square brackets] is highlighted as fill-in">'+esc(a&&a.text||'')+'</textarea>'+
      '<label for="st-'+esc(q.id)+'">Status</label><select id="st-'+esc(q.id)+'"><option value="answered"'+(a&&a.status==='answered'?' selected':'')+'>Answered</option><option value="added"'+(a&&a.status==='added'?' selected':'')+'>Added to the kit</option><option value="open"'+(a&&a.status==='open'?' selected':'')+'>Back to open</option></select>'+
      '<div class="formact"><button class="primary" data-saveans="'+esc(q.id)+'">Save answer</button><button class="ghost danger" data-delq="'+esc(q.id)+'">Delete question</button></div></div></details>';
  }else if(mine&&st==='open'){
    html+='<div class="formact"><button class="ghost danger" data-delq="'+esc(q.id)+'">Withdraw my question</button></div>';
  }
  return html+'</article>';
}
async function fillNames(){
  const els=[...document.querySelectorAll('.who[data-uid]')];if(!els.length||!COMM.user)return;
  const ids=[...new Set(els.map(e=>e.dataset.uid))];
  let ps={};try{ps=await COMM.user.profiles(ids)}catch(e){}
  els.forEach(e=>{const p=ps[e.dataset.uid];if(p&&p.isMe)e.textContent='Me';else e.textContent=(p&&p.name)||'A colleague'});
}
async function submitQ(){
  if(COMM.busy)return;
  const title=$('a-title').value.trim(),body=$('a-body').value.trim(),stage=$('a-stage').value,anon=$('a-anon').checked,err=$('a-err');
  if(title.length<4){err.textContent='Describe your situation in one sentence (at least 4 characters).';err.hidden=false;$('a-title').focus();return}
  err.hidden=true;COMM.busy=true;$('a-submit').textContent='Submitting…';$('a-submit').disabled=true;
  const doc={title:title.slice(0,120),body:body.slice(0,1000),stage:stage||'',from:COMM.ctx||'',createdAt:new Date().toISOString()};
  if(!anon&&COMM.me)doc.author=COMM.me;
  try{await COMM.db.collection('questions').doc().set(doc);COMM.ctx=null;toast('Submitted. We answer regularly, so check back soon');
    $('a-title').value='';$('a-body').value='';$('askbox').hidden=true;$('askopen').hidden=false;}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){COMM.readonly=true;err.textContent='You don’t have permission to ask yet. Ask the kit’s owner for Contributor access.'}
    else if(c==='quota_exceeded')err.textContent='The question limit has been reached. Ask an admin to clear old questions.';
    else if(c==='resource_exhausted')err.textContent='Too many submissions. Wait a moment and try again.';
    else err.textContent='Couldn’t submit. Check your connection and try again; your text is still here.';
    err.hidden=false}
  finally{COMM.busy=false;const b=$('a-submit');if(b){b.textContent='Submit question';b.disabled=false}}
}
async function saveAns(qid,btn){
  const box=document.querySelector('.ansform[data-q="'+qid+'"]');const text=box.querySelector('textarea').value.trim(),status=box.querySelector('select').value;
  if(status!=='open'&&!text){toast('Write the answer first');return}
  btn.disabled=true;btn.textContent='Saving…';
  try{await COMM.db.doc('answers/'+qid).set({text:text.slice(0,3000),status,at:new Date().toISOString(),by:COMM.me||''});toast('Answer saved and visible to everyone')}
  catch(e){toast(e&&e.code==='invalid_argument'?'You don’t have permission to answer':'Couldn’t save. Try again.')}
  finally{btn.disabled=false;btn.textContent='Save answer'}
}
async function delQ(qid,btn){
  if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Click again to confirm';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=COMM.admin?'Delete question':'Withdraw my question'}},4000);return}
  btn.disabled=true;
  try{await COMM.db.doc('questions/'+qid).delete();if(COMM.ans[qid])await COMM.db.doc('answers/'+qid).delete().catch(()=>{});toast('Deleted')}
  catch(e){btn.disabled=false;toast('Couldn’t delete. Try again.')}
}

/* ---------- routing ---------- */
let curRoute={tab:null,sec:null};
function route(){
  const h=(location.hash||'').slice(1);
  if(TABS[h]){curRoute={tab:h,sec:null};renderStage(TABS[h])}
  else if(SECS[h]){curRoute={tab:SECS[h].tab.id,sec:h};renderSec(SECS[h])}
  else if(h==='community'){curRoute={tab:null,sec:null};renderComm()}
  else{curRoute={tab:null,sec:null};renderHome(window._focusSearch)}
  renderSide(curRoute.tab,curRoute.sec,h==='community');
  if(!WIDE())setSide(false);
  window._focusSearch=false;
  window.scrollTo(0,0);
}
function nav(id,focus){
  window._focusSearch=!!focus;
  const target=id==='home'?'':id;
  if((location.hash||'').slice(1)===target){route();return}
  try{location.hash=target}catch(e){route()}
  if(!target){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}route()}
}
window.addEventListener('hashchange',route);

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function copyText(text,btn){
  const done=()=>{btn.textContent='Copied';btn.classList.add('done');toast('Copied. Remember to fill in the yellow [brackets]');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done')},1500)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    if(ok)done();else toast('Couldn’t copy automatically. Select the text and copy it.')};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.cp');if(c){e.preventDefault();copyText(COPY[+c.dataset.c],c);return}
  const m=e.target.closest('[data-more]');if(m){const w=m.previousElementSibling;w.hidden=false;w.replaceWith(...w.childNodes);m.remove();return}
  const et=e.target.closest('[data-entoggle]');if(et){setEn(document.body.classList.contains('hide-en'));return}
  const sd=e.target.closest('[data-side]');if(sd){setSide(sd.dataset.side==='toggle'?!sideOpen():false,true);return}
  if(e.target.id==='scrim'){setSide(false,false);return}
  const ak=e.target.closest('[data-ask]');if(ak){COMM.ctx=ak.dataset.ask||null;nav('community');return}
  const ao=e.target.closest('[data-askopen]');if(ao){$('askbox').hidden=false;ao.hidden=true;$('a-title').focus();return}
  const ac=e.target.closest('[data-askcancel]');if(ac){$('askbox').hidden=true;$('askopen').hidden=false;COMM.ctx=null;const f=document.querySelector('.from');if(f)f.remove();return}
  const fl=e.target.closest('[data-filter]');if(fl){COMM.filter=fl.dataset.filter;const keep=captureForm();renderComm();restoreForm(keep);return}
  const sa=e.target.closest('[data-saveans]');if(sa){e.preventDefault();saveAns(sa.dataset.saveans,sa);return}
  const dq=e.target.closest('[data-delq]');if(dq){e.preventDefault();delQ(dq.dataset.delq,dq);return}
  const n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav,n.dataset.focus);return}
});
document.addEventListener('submit',e=>{if(e.target.id==='askform'){e.preventDefault();submitQ()}});
/* one group open at a time (fallback for browsers without <details name>) */
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.grp')&&d.open){document.querySelectorAll('details.grp[open]').forEach(o=>{if(o!==d)o.open=false});
  const r=d.getBoundingClientRect();if(r.top<70)d.scrollIntoView({block:'start',behavior:'smooth'})}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sideOpen()&&!WIDE()){setSide(false);return}}});
window.matchMedia('(min-width:1000px)').addEventListener('change',initSide);

initSide();
if(store.get('rk-en')==='0')document.body.classList.add('hide-en');
route();
initComm();
})();
</script>
